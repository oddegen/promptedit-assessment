x-app: &app
    image: '${APP_IMAGE:-ghcr.io/oddegen/promptedit:latest}'
    restart: unless-stopped
    env_file: .env
    depends_on:
        pgsql:
            condition: service_healthy

services:
    web:
        <<: *app
        command: sh -c 'php artisan optimize && exec frankenphp run --config /etc/frankenphp/Caddyfile --adapter caddyfile'
        environment:
            SERVER_NAME: ':8080'
        ports:
            - '127.0.0.1:8080:8080'
    queue:
        <<: *app
        command: sh -c 'php artisan optimize && exec php artisan queue:work --sleep=1 --max-time=3600'
        healthcheck:
            disable: true
    scheduler:
        <<: *app
        command: sh -c 'php artisan optimize && exec php artisan schedule:work'
        healthcheck:
            disable: true
    pgsql:
        image: 'postgres:18-alpine'
        restart: unless-stopped
        environment:
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - 'pgsql:/var/lib/postgresql'
        healthcheck:
            test:
                [
                    'CMD',
                    'pg_isready',
                    '-q',
                    '-d',
                    '${DB_DATABASE}',
                    '-U',
                    '${DB_USERNAME}',
                ]
            interval: 5s
            timeout: 5s
            retries: 10
    backup:
        image: 'postgres:18-alpine'
        restart: unless-stopped
        environment:
            PGHOST: pgsql
            PGDATABASE: '${DB_DATABASE}'
            PGUSER: '${DB_USERNAME}'
            PGPASSWORD: '${DB_PASSWORD}'
        volumes:
            - './backups:/backups'
        command: sh -c 'while true; do pg_dump -Fc -f "/backups/$${PGDATABASE}-$$(date +%F).dump" && find /backups -name "*.dump" -mtime +14 -delete; sleep 86400; done'
        depends_on:
            pgsql:
                condition: service_healthy

volumes:
    pgsql:
